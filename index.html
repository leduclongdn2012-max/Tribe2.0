<!DOCTYPE html>
<button id="uploadOpenBtn">⬆️ Upload</button>
<button id="authBtn">Đăng nhập</button>
<div id="userMenu" class="hidden">
<img id="userAvatar" alt="avatar" />
<span id="userName"></span>
<button id="signOutBtn">Đăng xuất</button>
</div>
</div>
</header>


<main class="layout">
<aside class="left">
<nav>
<a href="#home" data-view="home">Trang chủ</a>
<a href="#subs" data-view="subs">Kênh theo dõi</a>
<a href="#trending" data-view="trending">Xu hướng</a>
<a href="#profile" data-view="profile">Kênh của tôi</a>
</nav>
</aside>


<section class="center" id="centerArea">
<!-- dynamic content inserted here -->
</section>


<aside class="right" id="rightAside">
<h3>Gợi ý cho bạn</h3>
<div id="recommendList"></div>
</aside>
</main>


<!-- Upload modal (hidden) -->
<div id="uploadModal" class="modal hidden">
<div class="modal-inner">
<h2>Upload video</h2>
<input id="videoFile" type="file" accept="video/*" />
<input id="videoTitle" placeholder="Tiêu đề" />
<input id="videoTags" placeholder="Thẻ (phân tách bằng dấu phẩy)" />
<button id="doUploadBtn">Tải lên</button>
<button id="closeUploadBtn">Đóng</button>
<div id="uploadProgress"></div>
</div>
</div>


<!-- Video player modal -->
<div id="playerModal" class="modal hidden">
<div class="modal-inner player-inner">
<button id="closePlayer">✖</button>
<div id="playerArea"></div>
<div id="videoMeta"></div>
<div id="commentBox"></div>
</div>
</div>


<script type="module" src="app.js"></script>
<!-- Firebase SDKs are imported inside app.js as modules -->
</body>
</html>
