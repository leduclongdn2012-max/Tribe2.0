<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TribeTube</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="logo">🌿 TribeTube</div>
    <div class="search-bar">
      <input type="text" placeholder="Tìm kiếm video..." id="searchInput">
      <button id="searchBtn">🔍</button>
    </div>
    <div class="user-actions">
      <button id="uploadBtn">⬆️ Upload</button>
      <img src="https://i.imgur.com/0y0y0y0.png" alt="Avatar" class="avatar">
    </div>
  </header>

  <nav class="sidebar">
    <a href="#">🏠 Trang chủ</a>
    <a href="#">📺 Kênh theo dõi</a>
    <a href="#">🔥 Xu hướng</a>
    <a href="#">👤 Kênh của tôi</a>
  </nav>

  <main class="main-content">
    <h2>🎥 Gợi ý cho bạn</h2>
    <div id="videoFeed" class="video-grid">
      <!-- Video sẽ hiển thị tại đây -->
    </div>
  </main>

  <!-- Modal upload -->
  <div id="uploadModal" class="modal hidden">
    <div class="modal-content">
      <span id="closeModal">&times;</span>
      <h3>Tải video lên</h3>
      <input type="file" id="videoFile" accept="video/*">
      <input type="text" id="videoTitle" placeholder="Tiêu đề">
      <textarea id="videoDesc" placeholder="Mô tả video..."></textarea>
      <button id="confirmUpload">Tải lên</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
