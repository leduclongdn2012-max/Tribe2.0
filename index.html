<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TribeTube</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Đăng nhập -->
  <div id="loginScreen" class="login-screen">
    <div class="login-box">
      <h2>🌿 TribeTube</h2>
      <input type="text" id="username" placeholder="Tên người dùng">
      <input type="password" id="password" placeholder="Mật khẩu">
      <button id="loginBtn">Đăng nhập</button>
      <p id="signupHint">Chưa có tài khoản? <span id="signupToggle" class="link-like">Đăng ký</span></p>
    </div>
  </div>

  <!-- Ứng dụng chính -->
  <div id="app" class="hidden">
    <header class="header">
      <div class="logo">🌿 TribeTube</div>
      <div class="search-bar">
        <input type="text" placeholder="Tìm kiếm video..." id="searchInput">
        <button id="searchBtn">🔍</button>
      </div>
      <div class="user-actions">
        <button id="uploadBtn">⬆️ Upload</button>
        <img id="userAvatar" src="https://i.imgur.com/4Z1Z9YB.png" class="avatar" alt="avatar">
        <button id="logoutBtn" class="logout">Đăng xuất</button>
      </div>
    </header>

    <nav class="sidebar">
      <a href="#" data-page="home" class="active">🏠 Trang chủ</a>
      <a href="#" data-page="following">📺 Kênh theo dõi</a>
      <a href="#" data-page="trend">🔥 Xu hướng</a>
      <a href="#" data-page="mychannel">👤 Kênh của tôi</a>
    </nav>

    <main class="main-content" id="mainContent"></main>

    <!-- Modal upload -->
    <div id="uploadModal" class="modal hidden">
      <div class="modal-content">
        <span id="closeModal" class="close">&times;</span>
        <h3>Tải video lên</h3>
        <input type="file" id="videoFile" accept="video/*">
        <input type="text" id="videoTitle" placeholder="Tiêu đề">
        <textarea id="videoDesc" placeholder="Mô tả video..."></textarea>
        <button id="confirmUpload">Tải lên</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
