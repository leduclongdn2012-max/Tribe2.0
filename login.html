<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TribeTube - Đăng nhập</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #009f4d, #00b7ff);
      height: 100vh;
    }
    .login-box {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 40px;
      border-radius: 15px;
      color: #fff;
      width: 300px;
      text-align: center;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 8px;
      border: none;
      outline: none;
    }
    button {
      width: 100%;
      background: #00b55a;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background: #00994a;
    }
    a {
      color: #fff;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>🔐 Đăng nhập TribeTube</h2>
    <input type="text" id="username" placeholder="Tên người dùng" />
    <input type="password" id="password" placeholder="Mật khẩu" />
    <button id="loginBtn">Đăng nhập</button>
    <p>Chưa có tài khoản? <a href="#" id="registerLink">Đăng ký</a></p>
  </div>

  <script>
    const loginBtn = document.getElementById("loginBtn");
    const registerLink = document.getElementById("registerLink");

    loginBtn.onclick = () => {
      const user = document.getElementById("username").value;
      const pass = document.getElementById("password").value;
      if (!user || !pass) return alert("Nhập đủ thông tin!");

      const saved = localStorage.getItem("tribeUser");
      if (saved) {
        const acc = JSON.parse(saved);
        if (acc.user === user && acc.pass === pass) {
          alert("Đăng nhập thành công!");
          localStorage.setItem("loggedIn", "true");
          window.location.href = "index.html";
        } else {
          alert("Sai tên hoặc mật khẩu!");
        }
      } else {
        alert("Chưa có tài khoản nào, hãy đăng ký trước!");
      }
    };

    registerLink.onclick = () => {
      const newUser = prompt("Nhập tên tài khoản:");
      const newPass = prompt("Nhập mật khẩu:");
      if (newUser && newPass) {
        localStorage.setItem("tribeUser", JSON.stringify({ user: newUser, pass: newPass }));
        alert("Tạo tài khoản thành công! Giờ bạn có thể đăng nhập.");
      }
    };
  </script>
</body>
</html>
